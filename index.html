<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tornado Tactical Strike</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-red: #ff004c;
            --hud-bg: rgba(0, 20, 40, 0.8);
        }
        body {
            margin: 0; padding: 0; background: #050505;
            color: white; font-family: 'Courier New', Courier, monospace;
            overflow: hidden; touch-action: none;
        }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { display: block; background: linear-gradient(to bottom, #0a0a1a, #1a1a2e); }

        /* HUD */
        .hud {
            position: absolute; top: 20px; left: 20px;
            background: var(--hud-bg); padding: 15px;
            border-left: 4px solid var(--neon-blue); border-radius: 0 10px 10px 0;
            pointer-events: none;
        }
        .stats { font-size: 1.2rem; margin-bottom: 5px; color: var(--neon-blue); }

        /* Shop UI */
        #shop-ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--hud-bg); border: 2px solid var(--neon-blue);
            padding: 30px; border-radius: 15px; display: none; text-align: center;
            backdrop-filter: blur(10px); z-index: 100;
        }
        .shop-item {
            background: rgba(255, 255, 255, 0.1); padding: 10px; margin: 10px 0;
            border-radius: 5px; cursor: pointer; transition: 0.3s;
        }
        .shop-item:hover { background: var(--neon-blue); color: black; }

        /* Controls Display */
        #controls-info {
            position: absolute; bottom: 20px; right: 20px;
            background: var(--hud-bg); padding: 10px; border-radius: 8px;
            font-size: 0.8rem; display: none; opacity: 0.7;
        }

        /* Mobile Joystick Area */
        #joystick-container {
            position: absolute; bottom: 50px; left: 50px;
            width: 120px; height: 120px; background: rgba(255,255,255,0.05);
            border-radius: 50%; display: none; border: 1px solid rgba(255,255,255,0.2);
        }
        #joystick-knob {
            position: absolute; width: 50px; height: 50px;
            background: var(--neon-blue); border-radius: 50%;
            top: 35px; left: 35px; opacity: 0.5;
        }
        #fire-btn {
            position: absolute; bottom: 50px; right: 50px;
            width: 80px; height: 80px; background: var(--neon-red);
            border-radius: 50%; display: none; opacity: 0.6;
            justify-content: center; align-items: center; font-weight: bold;
        }
        #shop-btn {
            position: absolute; top: 20px; right: 20px;
            background: var(--neon-blue); color: black; padding: 10px;
            border-radius: 5px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="hud">
            <div class="stats">CREDITS: <span id="score">0</span></div>
            <div id="weapon-status" style="font-size: 0.8rem;">WEAPON: MAUSER 27MM</div>
        </div>

        <div id="shop-btn" onclick="toggleShop()">SHOP (P)</div>

        <div id="shop-ui">
            <h2>TORNADO ARMORY</h2>
            <div class="shop-item" onclick="buyWeapon('bombs')">MK82 BOMBS (500 CREDITS)</div>
            <div class="shop-item" onclick="buyWeapon('speed')">ENGINE UPGRADE (300 CREDITS)</div>
            <button onclick="toggleShop()" style="margin-top: 20px;">BACK TO COCKPIT</button>
        </div>

        <div id="controls-info">
            WASD / Arrows: FLYING<br>
            SPACE: MAUSER CANNON<br>
            B: DROP BOMB<br>
            P: SHOP
        </div>

        <div id="joystick-container"><div id="joystick-knob"></div></div>
        <div id="fire-btn">FIRE</div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Game State
    let score = 0;
    let isShopOpen = false;
    let inputMode = 'keyboard'; // Default
    let hasBombs = false;

    // Tornado Object
    const tornado = {
        x: 150, y: 300, w: 80, h: 30,
        speed: 5, vy: 0, vx: 0,
        draw() {
            ctx.fillStyle = '#555'; // Tornado Grau
            // Body
            ctx.fillRect(this.x, this.y, this.w, this.h);
            // Cockpit
            ctx.fillStyle = varColor('--neon-blue');
            ctx.fillRect(this.x + 50, this.y + 5, 20, 10);
            // Wings (Swing Wing Effekt angedeutet)
            ctx.fillStyle = '#444';
            ctx.beginPath();
            ctx.moveTo(this.x + 10, this.y);
            ctx.lineTo(this.x + 40, this.y - 20);
            ctx.lineTo(this.x + 50, this.y);
            ctx.fill();
        }
    };

    let bullets = [];
    let bombs = [];
    let enemies = [];
    let particles = [];

    // Controls
    const keys = {};
    window.addEventListener('keydown', e => { 
        keys[e.code] = true; 
        inputMode = 'keyboard'; 
        document.getElementById('controls-info').style.display = 'block';
        if(e.code === 'KeyP') toggleShop();
        if(e.code === 'Space') fireCannon();
        if(e.code === 'KeyB' && hasBombs) dropBomb();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Touch Controls
    let touchStartX = 0, touchStartY = 0;
    window.addEventListener('touchstart', e => {
        inputMode = 'touch';
        document.getElementById('joystick-container').style.display = 'block';
        document.getElementById('fire-btn').style.display = 'flex';
        document.getElementById('controls-info').style.display = 'none';
    });

    function toggleShop() {
        isShopOpen = !isShopOpen;
        document.getElementById('shop-ui').style.display = isShopOpen ? 'block' : 'none';
    }

    function buyWeapon(type) {
        if(type === 'bombs' && score >= 500) {
            score -= 500;
            hasBombs = true;
            document.getElementById('weapon-status').innerText = "WEAPON: MAUSER + MK82 BOMBS";
            alert("MK82 BOMBS LOADED!");
        }
        updateScore();
    }

    function fireCannon() {
        if(isShopOpen) return;
        bullets.push({x: tornado.x + tornado.w, y: tornado.y + 20, vx: 15, vy: 0});
    }

    function dropBomb() {
        if(!hasBombs || isShopOpen) return;
        bombs.push({x: tornado.x + 30, y: tornado.y + 30, vx: 2, vy: 5});
    }

    function spawnEnemy() {
        if(Math.random() < 0.02) {
            enemies.push({
                x: canvas.width + 100,
                y: canvas.height - 60,
                w: 50, h: 30,
                type: 'tank',
                hp: 1
            });
        }
    }

    function update() {
        if(isShopOpen) return;

        // Movement Keyboard
        if(keys['ArrowUp'] || keys['KeyW']) tornado.y -= tornado.speed;
        if(keys['ArrowDown'] || keys['KeyS']) tornado.y += tornado.speed;
        if(keys['ArrowLeft'] || keys['KeyA']) tornado.x -= tornado.speed;
        if(keys['ArrowRight'] || keys['KeyD']) tornado.x += tornado.speed;

        // Borders
        if(tornado.y < 0) tornado.y = 0;
        if(tornado.y > canvas.height - 40) tornado.y = canvas.height - 40;

        // Bullets
        bullets.forEach((b, i) => {
            b.x += b.vx;
            if(b.x > canvas.width) bullets.splice(i, 1);
        });

        // Bombs
        bombs.forEach((b, i) => {
            b.x += b.vx;
            b.y += b.vy;
            if(b.y > canvas.height - 30) {
                createExplosion(b.x, b.y);
                bombs.splice(i, 1);
                // Area Damage
                enemies.forEach((en, ei) => {
                    if(Math.abs(en.x - b.x) < 100) {
                        score += 100;
                        enemies.splice(ei, 1);
                    }
                });
            }
        });

        // Enemies & Collision
        enemies.forEach((en, i) => {
            en.x -= 3;
            bullets.forEach((b, bi) => {
                if(b.x > en.x && b.x < en.x + en.w && b.y > en.y && b.y < en.y + en.h) {
                    createExplosion(en.x, en.y);
                    enemies.splice(i, 1);
                    bullets.splice(bi, 1);
                    score += 50;
                    updateScore();
                }
            });
            if(en.x < -100) enemies.splice(i, 1);
        });

        spawnEnemy();
        updateParticles();
    }

    function createExplosion(x, y) {
        for(let i=0; i<15; i++) {
            particles.push({
                x, y, 
                vx: (Math.random()-0.5)*10, 
                vy: (Math.random()-0.5)*10, 
                life: 1.0,
                color: Math.random() > 0.5 ? '#ff4400' : '#ffcc00'
            });
        }
    }

    function updateParticles() {
        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy;
            p.life -= 0.02;
            if(p.life <= 0) particles.splice(i, 1);
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Ground
        ctx.fillStyle = '#0f0f0f';
        ctx.fillRect(0, canvas.height - 30, canvas.width, 30);

        // Draw Particles
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, 4, 4);
        });
        ctx.globalAlpha = 1.0;

        // Draw Tornado
        tornado.draw();

        // Draw Bullets
        ctx.fillStyle = varColor('--neon-red');
        bullets.forEach(b => ctx.fillRect(b.x, b.y, 10, 3));

        // Draw Bombs
        ctx.fillStyle = '#ffcc00';
        bombs.forEach(b => {
            ctx.beginPath();
            ctx.arc(b.x, b.y, 6, 0, Math.PI*2);
            ctx.fill();
        });

        // Draw Enemies
        enemies.forEach(en => {
            ctx.fillStyle = '#2d3436';
            ctx.fillRect(en.x, en.y, en.w, en.h);
            ctx.fillStyle = '#d63031';
            ctx.fillRect(en.x + 10, en.y - 10, 20, 10); // Turm
        });

        requestAnimationFrame(() => {
            update();
            draw();
        });
    }

    function updateScore() {
        document.getElementById('score').innerText = score;
    }

    function varColor(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    // Touch Event Hook
    document.getElementById('fire-btn').addEventListener('touchstart', (e) => {
        e.preventDefault();
        fireCannon();
    });

    draw();
</script>
</body>
</html>
