<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TORNADO BLACK OPS ENGINE</title>

<style>

body{
margin:0;
background:#02040a;
overflow:hidden;
font-family:monospace;
color:white;
}

canvas{
position:absolute;
top:0;
left:0;
}

#boot{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:black;
z-index:10;
}

button{
padding:20px 50px;
font-size:20px;
cursor:pointer;
}

</style>
</head>

<body>

<div id="boot">
<button id="startBtn">START MISSION</button>
</div>

<canvas id="game"></canvas>

<script>

/* =====================================================
   CONFIG
===================================================== */

const CONFIG = {

gravity:0.25,
friction:0.98,

bulletSpeed:25,
enemySpeed:6,

spawnChance:0.015,

terrainSegments:120,
terrainSpacing:80

}

/* =====================================================
   VECTOR
===================================================== */

class Vector{

constructor(x=0,y=0){

this.x=x
this.y=y

}

add(v){

this.x+=v.x
this.y+=v.y

return this

}

multiply(n){

this.x*=n
this.y*=n

return this

}

clone(){

return new Vector(this.x,this.y)

}

}

/* =====================================================
   PARTICLE
===================================================== */

class Particle{

constructor(x,y,vx,vy,life,color){

this.pos=new Vector(x,y)
this.vel=new Vector(vx,vy)

this.life=life
this.maxLife=life
this.color=color
this.size=4

}

update(){

this.pos.add(this.vel)

this.life-=0.02

}

draw(ctx){

ctx.globalAlpha=this.life

ctx.fillStyle=this.color

ctx.fillRect(this.pos.x,this.pos.y,this.size,this.size)

ctx.globalAlpha=1

}

}

/* =====================================================
   BULLET
===================================================== */

class Bullet{

constructor(x,y){

this.x=x
this.y=y

}

update(){

this.x+=CONFIG.bulletSpeed

}

draw(ctx){

ctx.fillStyle="yellow"
ctx.fillRect(this.x,this.y,12,3)

}

}

/* =====================================================
   ENEMY
===================================================== */

class Enemy{

constructor(x,y){

this.x=x
this.y=y

this.width=60
this.height=30

}

update(){

this.x-=CONFIG.enemySpeed

}

draw(ctx){

ctx.fillStyle="#111"

ctx.fillRect(this.x-30,this.y-30,60,30)

ctx.fillStyle="red"

ctx.fillRect(this.x-5,this.y-45,10,15)

}

}

/* =====================================================
   PLAYER
===================================================== */

class Player{

constructor(){

this.pos=new Vector(250,400)

this.vel=new Vector()

this.angle=0

this.heat=0

}

update(input){

if(input.up){

this.vel.y-=0.7

}

if(input.down){

this.vel.y+=0.7

}

this.vel.multiply(CONFIG.friction)

this.pos.add(this.vel)

this.angle=this.vel.y*0.04

}

draw(ctx){

ctx.save()

ctx.translate(this.pos.x,this.pos.y)

ctx.rotate(this.angle)

/* wing */

ctx.fillStyle="#444"

ctx.beginPath()

ctx.moveTo(-20,0)
ctx.lineTo(-50,-35)
ctx.lineTo(10,0)

ctx.fill()

/* body */

ctx.fillStyle="#777"

ctx.beginPath()

ctx.moveTo(-65,5)
ctx.lineTo(85,10)
ctx.lineTo(75,25)
ctx.lineTo(-60,28)

ctx.fill()

/* cockpit */

ctx.fillStyle="cyan"

ctx.beginPath()

ctx.ellipse(45,10,20,7,0,0,Math.PI*2)

ctx.fill()

ctx.restore()

}

}

/* =====================================================
   GAME ENGINE
===================================================== */

class Game{

constructor(){

this.canvas=document.getElementById("game")
this.ctx=this.canvas.getContext("2d")

this.resize()

window.addEventListener("resize",()=>this.resize())

this.player=new Player()

this.bullets=[]
this.enemies=[]
this.particles=[]

this.input={
up:false,
down:false,
fire:false
}

this.frame=0

this.running=false

this.setupInput()

this.lastTime=0

requestAnimationFrame((t)=>this.loop(t))

}

/* ---------------------------- */

resize(){

this.canvas.width=window.innerWidth
this.canvas.height=window.innerHeight

}

/* ---------------------------- */

setupInput(){

window.addEventListener("keydown",(e)=>{

if(e.code==="ArrowUp")this.input.up=true
if(e.code==="ArrowDown")this.input.down=true
if(e.code==="Space")this.input.fire=true

})

window.addEventListener("keyup",(e)=>{

if(e.code==="ArrowUp")this.input.up=false
if(e.code==="ArrowDown")this.input.down=false
if(e.code==="Space")this.input.fire=false

})

}

/* ---------------------------- */

spawnEnemy(){

const y=this.canvas.height-40

this.enemies.push(new Enemy(this.canvas.width+100,y))

}

/* ---------------------------- */

spawnExplosion(x,y){

for(let i=0;i<25;i++){

this.particles.push(

new Particle(
x,
y,
(Math.random()-0.5)*10,
(Math.random()-0.5)*10,
1.5,
"orange"
)

)

}

}

/* ---------------------------- */

update(){

if(!this.running)return

this.frame++

this.player.update(this.input)

/* fire */

if(this.input.fire && this.frame%5===0){

this.bullets.push(
new Bullet(
this.player.pos.x+60,
this.player.pos.y+10
)
)

}

/* bullets */

for(let i=this.bullets.length-1;i>=0;i--){

let b=this.bullets[i]

b.update()

if(b.x>this.canvas.width){

this.bullets.splice(i,1)

}

}

/* enemy spawn */

if(Math.random()<CONFIG.spawnChance){

this.spawnEnemy()

}

/* enemies */

for(let i=this.enemies.length-1;i>=0;i--){

let e=this.enemies[i]

e.update()

if(e.x<-100){

this.enemies.splice(i,1)

continue

}

/* collision */

for(let j=this.bullets.length-1;j>=0;j--){

let b=this.bullets[j]

if(Math.abs(b.x-e.x)<40 && Math.abs(b.y-e.y)<40){

this.spawnExplosion(e.x,e.y)

this.enemies.splice(i,1)
this.bullets.splice(j,1)

break

}

}

}

/* particles */

for(let i=this.particles.length-1;i>=0;i--){

let p=this.particles[i]

p.update()

if(p.life<=0){

this.particles.splice(i,1)

}

}

}

/* ---------------------------- */

draw(){

const ctx=this.ctx

ctx.clearRect(0,0,this.canvas.width,this.canvas.height)

/* sky */

let g=ctx.createLinearGradient(0,0,0,this.canvas.height)

g.addColorStop(0,"#00050a")
g.addColorStop(1,"#001a33")

ctx.fillStyle=g
ctx.fillRect(0,0,this.canvas.width,this.canvas.height)

/* bullets */

this.bullets.forEach(b=>b.draw(ctx))

/* enemies */

this.enemies.forEach(e=>e.draw(ctx))

/* particles */

this.particles.forEach(p=>p.draw(ctx))

/* player */

this.player.draw(ctx)

}

/* ---------------------------- */

loop(time){

let dt=time-this.lastTime

this.lastTime=time

this.update()

this.draw()

requestAnimationFrame((t)=>this.loop(t))

}

}

/* =====================================================
   BOOT
===================================================== */

let game

document.getElementById("startBtn").onclick=()=>{

document.getElementById("boot").style.display="none"

game=new Game()

game.running=true

}

</script>
</body>
</html>
