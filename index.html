<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TORNADO: BLACK OPS - PRO EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-red: #ff004c;
            --hud-green: #00ff41;
            --warning: #ffae00;
            --bg-dark: #010204;
            --panel-bg: rgba(0, 10, 20, 0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        canvas { display: block; image-rendering: auto; }

        /* --- UI LAYER --- */
        #ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        .hud-panel {
            position: absolute;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 242, 255, 0.2);
            backdrop-filter: blur(8px);
            padding: 15px;
            border-radius: 4px;
            pointer-events: auto;
        }

        #hud-left { top: 20px; left: 20px; width: 220px; }
        #hud-right { top: 20px; right: 20px; width: 220px; text-align: right; }

        .label { font-size: 0.6rem; color: var(--hud-green); text-transform: uppercase; letter-spacing: 1px; }
        .value { font-family: 'Orbitron'; font-size: 1.1rem; margin-bottom: 5px; color: #fff; }

        .bar-bg { width: 100%; height: 6px; background: #111; border: 1px solid #333; margin: 4px 0 10px 0; border-radius: 3px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; transition: width 0.1s; }
        .fill-red { background: var(--neon-red); box-shadow: 0 0 8px var(--neon-red); }
        .fill-blue { background: var(--neon-blue); box-shadow: 0 0 8px var(--neon-blue); }

        /* --- SCREENS --- */
        .screen {
            position: absolute; inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex; justify-content: center; align-items: center;
            z-index: 100; pointer-events: auto;
        }

        .box {
            width: 90%; max-width: 500px;
            background: #050a10;
            border: 2px solid var(--neon-blue);
            padding: 40px; border-radius: 8px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
        }

        .btn {
            background: var(--neon-blue); color: #000;
            border: none; padding: 15px 45px; font-family: 'Orbitron';
            font-weight: bold; cursor: pointer; border-radius: 4px;
            margin-top: 20px; transition: 0.2s;
        }

        .btn:hover { background: #fff; transform: scale(1.05); }

        /* Mobile Controls */
        #mobile-ui {
            position: absolute; bottom: 30px; left: 0; width: 100%;
            display: none; justify-content: space-between; padding: 0 40px;
            z-index: 50;
        }
        .btn-round {
            width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--neon-blue);
            background: rgba(0, 242, 255, 0.1); color: white; display: flex;
            align-items: center; justify-content: center; font-weight: bold; font-family: Orbitron;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="hud-left" class="hud-panel">
            <div class="label">Telemetry Data</div>
            <div class="value">ALT: <span id="ui-alt">0</span>m</div>
            <div class="value">SPD: <span id="ui-spd">0</span>kts</div>
            <div class="label" style="margin-top:10px">Combat Credits</div>
            <div id="ui-credits" class="value" style="color:var(--warning)">0</div>
        </div>

        <div id="hud-right" class="hud-panel">
            <div class="label">BK-27 Cannon Temp</div>
            <div class="bar-bg"><div id="bar-heat" class="bar-fill fill-red"></div></div>
            <div class="label">Ordnance Status</div>
            <div class="bar-bg"><div id="bar-bomb" class="bar-fill fill-blue"></div></div>
            <div id="ui-weapon" class="label" style="color:var(--neon-blue)">Weapon: Cannon</div>
        </div>

        <div id="screen-start" class="screen">
            <div class="box">
                <h1 style="font-family:'Orbitron'; color:var(--neon-blue); font-size: 2.5rem; margin-bottom: 10px;">TORNADO</h1>
                <p style="color:var(--hud-green); letter-spacing: 2px; font-size: 0.8rem;">BLACK OPS SIMULATOR V4.0</p>
                <div style="margin: 30px 0; color: #555; font-size: 0.7rem; text-align: left; line-height: 1.6;">
                    > ENGINE INITIALIZED...<br>
                    > VECTOR PHYSICS LOADED...<br>
                    > WEAPON SYSTEMS ARMED...<br>
                    > READY FOR SORTIE.
                </div>
                <button class="btn" id="start-button">INITIATE MISSION</button>
            </div>
        </div>
    </div>

    <div id="mobile-ui">
        <div class="btn-round" id="m-up">UP</div>
        <div class="btn-round" id="m-down">DN</div>
        <div class="btn-round" id="m-fire" style="border-color:var(--neon-red)">FIRE</div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
/**
 * TORNADO BLACK OPS - ADVANCED CORE
 * ---------------------------------
 */

// 1. Vector Math Library
class Vec2 {
    constructor(x = 0, y = 0) { this.x = x; this.y = y; }
    add(v) { this.x += v.x; this.y += v.y; return this; }
    sub(v) { this.x -= v.x; this.y -= v.y; return this; }
    mult(n) { this.x *= n; this.y *= n; return this; }
    mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
    static dist(v1, v2) { return Math.sqrt((v1.x - v2.x)**2 + (v1.y - v2.y)**2); }
}

// 2. Particle Entity
class Particle {
    constructor(x, y, vx, vy, life, color, size, type = 'spark') {
        this.pos = new Vec2(x, y);
        this.vel = new Vec2(vx, vy);
        this.life = life;
        this.maxLife = life;
        this.color = color;
        this.size = size;
        this.type = type;
    }
    update() {
        this.pos.add(this.vel);
        this.life -= 0.02;
        if(this.type === 'smoke') this.vel.y -= 0.005;
    }
    draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
        ctx.fillStyle = this.color;
        ctx.translate(this.pos.x, this.pos.y);
        ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
        ctx.restore();
    }
}

// 3. Main Game Engine
class TornadoEngine {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.isRunning = false;
        this.frame = 0;
        this.credits = 0;
        
        // Flight State
        this.player = {
            pos: new Vec2(250, 300),
            vel: new Vec2(0, 0),
            angle: 0,
            targetAngle: 0,
            heat: 0,
            bombCD: 0,
            speed: 7
        };

        // World Objects
        this.entities = {
            bullets: [],
            bombs: [],
            enemies: [],
            particles: [],
            terrain: [],
            clouds: []
        };

        this.input = { up: false, down: false, fire: false, bomb: false };
        
        this.init();
    }

    init() {
        window.addEventListener('resize', () => this.resize());
        this.resize();
        this.setupControls();
        this.genWorld();
        
        // Start Loop
        this.loop();
    }

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    }

    setupControls() {
        // Keyboard
        window.addEventListener('keydown', e => this.handleKey(e.code, true));
        window.addEventListener('keyup', e => this.handleKey(e.code, false));
        
        // Start Button Fix
        document.getElementById('start-button').onclick = (e) => {
            e.stopPropagation();
            this.startMission();
        };

        // Mobile
        if('ontouchstart' in window) {
            document.getElementById('mobile-ui').style.display = 'flex';
            this.setupMobile();
        }
    }

    handleKey(code, isDown) {
        if(code === 'ArrowUp' || code === 'KeyW') this.input.up = isDown;
        if(code === 'ArrowDown' || code === 'KeyS') this.input.down = isDown;
        if(code === 'Space') this.input.fire = isDown;
        if(code === 'KeyB') this.input.bomb = isDown;
    }

    setupMobile() {
        const bind = (id, key) => {
            const el = document.getElementById(id);
            el.ontouchstart = (e) => { e.preventDefault(); this.input[key] = true; };
            el.ontouchend = () => this.input[key] = false;
        };
        bind('m-up', 'up'); bind('m-down', 'down'); bind('m-fire', 'fire');
    }

    genWorld() {
        for(let i=0; i<150; i++) {
            this.entities.terrain.push({ x: i * 70, h: 40 + Math.random() * 120 });
        }
        for(let i=0; i<12; i++) {
            this.entities.clouds.push({ 
                x: Math.random() * canvas.width, 
                y: Math.random() * 300, 
                w: 150 + Math.random() * 100, 
                s: 0.5 + Math.random() 
            });
        }
    }

    startMission() {
        this.isRunning = true;
        document.getElementById('screen-start').style.display = 'none';
        console.log("Mission Initiated");
    }

    spawnExplosion(x, y, scale = 1) {
        for(let i=0; i<20 * scale; i++) {
            this.entities.particles.push(new Particle(
                x, y, 
                (Math.random()-0.5)*12, (Math.random()-0.5)*12, 
                1.5, Math.random() > 0.5 ? '#ff4c00' : '#ff9900', 4
            ));
        }
    }

    update() {
        if(!this.isRunning) return;
        this.frame++;

        // 1. Flight Dynamics
        if(this.input.up) this.player.targetAngle = -0.35;
        else if(this.input.down) this.player.targetAngle = 0.35;
        else this.player.targetAngle = 0;

        this.player.angle += (this.player.targetAngle - this.player.angle) * 0.08;
        
        let thrust = new Vec2(Math.cos(this.player.angle), Math.sin(this.player.angle)).mult(0.5);
        this.player.vel.add(thrust);
        this.player.vel.mult(0.97); // Air resistance
        this.player.pos.add(this.player.vel);

        // Bounds
        if(this.player.pos.y < 60) { this.player.pos.y = 60; this.player.vel.y = 0; }
        if(this.player.pos.y > this.canvas.height - 110) { this.player.pos.y = this.canvas.height - 110; this.player.vel.y = 0; }

        // 2. Weapons Logic
        if(this.input.fire && this.player.heat < 100 && this.frame % 5 === 0) {
            this.entities.bullets.push({
                x: this.player.pos.x + 60, y: this.player.pos.y + 10,
                vx: 25, vy: this.player.angle * 10
            });
            this.player.heat += 4;
        }
        this.player.heat = Math.max(0, this.player.heat - 0.4);

        // 3. Entity Processing
        this.entities.bullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy;
            if(b.x > this.canvas.width) this.entities.bullets.splice(i, 1);
        });

        if(this.frame % 90 === 0) {
            this.entities.enemies.push({ x: this.canvas.width + 100, y: this.canvas.height - 40 });
        }

        this.entities.enemies.forEach((en, i) => {
            en.x -= 5;
            // Collision
            this.entities.bullets.forEach((b, bi) => {
                if(Math.abs(b.x - en.x) < 50 && b.y > en.y - 40) {
                    this.spawnExplosion(en.x, en.y - 20);
                    this.entities.enemies.splice(i, 1);
                    this.entities.bullets.splice(bi, 1);
                    this.credits += 100;
                }
            });
            if(en.x < -100) this.entities.enemies.splice(i, 1);
        });

        this.entities.particles.forEach((p, i) => {
            p.update();
            if(p.life <= 0) this.entities.particles.splice(i, 1);
        });

        // 4. Update HUD
        document.getElementById('ui-alt').innerText = Math.floor((this.canvas.height - this.player.pos.y) * 2.8);
        document.getElementById('ui-spd').innerText = Math.floor(this.player.vel.mag() * 45);
        document.getElementById('ui-credits').innerText = this.credits;
        document.getElementById('bar-heat').style.width = this.player.heat + "%";
    }

    draw() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        // Sky Gradient
        let sky = ctx.createLinearGradient(0, 0, 0, this.canvas.height);
        sky.addColorStop(0, '#000810'); sky.addColorStop(1, '#001a33');
        ctx.fillStyle = sky; ctx.fillRect(0,0, this.canvas.width, this.canvas.height);

        // Clouds (Parallax)
        ctx.fillStyle = 'rgba(255,255,255,0.03)';
        this.entities.clouds.forEach(c => {
            c.x -= c.s;
            if(c.x < -c.w) c.x = this.canvas.width + c.w;
            ctx.beginPath(); ctx.ellipse(c.x, c.y, c.w/2, 25, 0, 0, Math.PI*2); ctx.fill();
        });

        // Terrain
        ctx.fillStyle = '#050a0f';
        ctx.beginPath(); ctx.moveTo(0, this.canvas.height);
        this.entities.terrain.forEach(pt => {
            let tx = (pt.x - this.frame * 4) % (150 * 70);
            if(tx < 0) tx += 150 * 70;
            ctx.lineTo(tx, this.canvas.height - pt.h);
        });
        ctx.lineTo(this.canvas.width, this.canvas.height); ctx.fill();

        // Enemies
        this.entities.enemies.forEach(en => {
            ctx.fillStyle = '#111'; ctx.fillRect(en.x - 30, en.y - 20, 60, 20);
            ctx.fillStyle = '#d00'; ctx.fillRect(en.x - 5, en.y - 35, 10, 15);
        });

        // Particles & Bullets
        this.entities.particles.forEach(p => p.draw(ctx));
        ctx.fillStyle = '#ff0';
        this.entities.bullets.forEach(b => ctx.fillRect(b.x, b.y, 12, 2));

        // TORNADO MODEL
        ctx.save();
        ctx.translate(this.player.pos.x, this.player.pos.y);
        ctx.rotate(this.player.angle);
        
        // Wing
        ctx.fillStyle = '#3a4146';
        ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-45, -30); ctx.lineTo(5, 0); ctx.fill();
        // Fuselage
        let g = ctx.createLinearGradient(0, 0, 0, 25);
        g.addColorStop(0, '#5e676d'); g.addColorStop(1, '#2c3338');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(-55, 5); ctx.lineTo(75, 8); ctx.lineTo(65, 22); ctx.lineTo(-50, 24); ctx.fill();
        // Cockpit
        ctx.fillStyle = 'rgba(0, 242, 255, 0.4)';
        ctx.beginPath(); ctx.ellipse(40, 8, 18, 6, 0, 0, Math.PI*2); ctx.fill();
        // Tail
        ctx.fillStyle = '#2c3338';
        ctx.beginPath(); ctx.moveTo(-30, 5); ctx.lineTo(-50, -25); ctx.lineTo(-20, 5); ctx.fill();
        
        ctx.restore();
    }

    loop() {
        this.update();
        this.draw();
        requestAnimationFrame(() => this.loop());
    }
}

// Launch
window.onload = () => {
    window.game = new TornadoEngine();
};

</script>
</body>
</html>
