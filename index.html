<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tornado Tactical Strike PRO</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-red: #ff004c;
            --hud-green: #00ff41;
            --hud-bg: rgba(0, 10, 20, 0.85);
        }
        body {
            margin: 0; padding: 0; background: #020205;
            color: white; font-family: 'Orbitron', 'Courier New', monospace;
            overflow: hidden; touch-action: none;
        }
        canvas { display: block; }

        /* Modern HUD */
        #hud {
            position: absolute; top: 20px; left: 20px;
            background: var(--hud-bg); padding: 15px;
            border: 1px solid var(--hud-green); border-radius: 5px;
            pointer-events: none; min-width: 200px;
        }
        .bar-container {
            width: 100%; height: 10px; background: #111; margin-top: 5px; border: 1px solid #444;
        }
        #bomb-bar { width: 100%; height: 100%; background: var(--neon-blue); transition: width 0.1s; }
        
        #shop-ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--hud-bg); border: 2px solid var(--neon-blue);
            padding: 40px; border-radius: 20px; display: none; text-align: center;
            backdrop-filter: blur(15px); z-index: 100; box-shadow: 0 0 50px rgba(0, 242, 255, 0.3);
        }
        .shop-btn {
            background: rgba(34, 211, 238, 0.2); border: 1px solid var(--neon-blue);
            color: white; padding: 15px 30px; margin: 10px; cursor: pointer; font-weight: bold;
        }
        .shop-btn:hover { background: var(--neon-blue); color: black; }

        #controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: var(--hud-green); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div style="color: var(--hud-green); font-weight: bold;">[ TACTICAL DISPLAY ]</div>
        <div style="margin-top: 10px;">CREDITS: <span id="score">0</span></div>
        <div style="font-size: 0.7rem; margin-top: 10px;">BOMB RELOAD</div>
        <div class="bar-container"><div id="bomb-bar"></div></div>
    </div>

    <div id="shop-ui">
        <h1 style="color: var(--neon-blue)">MAINTENANCE HANGAR</h1>
        <p>Wähle deine Bewaffnung:</p>
        <button class="shop-btn" onclick="buy('bombs')">MK82 CLUSTER BOMBS (500 CR)</button>
        <button class="shop-btn" onclick="toggleShop()">RETURN TO MISSION</button>
    </div>

    <div id="controls">W/S: Pitch | A/D: Speed | Space: Cannon | B: Bomb | P: Hangar</div>

    <canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game Variables
    let score = 0;
    let isShopOpen = false;
    let hasBombs = false;
    let bombCooldown = 0;
    const BOMB_MAX_COOLDOWN = 120; // Frames

    // Input
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);
    window.addEventListener('keydown', e => { if(e.code === 'KeyP') toggleShop(); });

    // Game Objects
    const jet = {
        x: 200, y: 300, 
        w: 120, h: 40,
        angle: 0, // Neigung in Radianten
        speed: 6,
        targetAngle: 0,
        update() {
            // Steuerung der Neigung
            if(keys['ArrowUp'] || keys['KeyW']) this.targetAngle = -0.4;
            else if(keys['ArrowDown'] || keys['KeyS']) this.targetAngle = 0.4;
            else this.targetAngle = 0;

            // Smoother Übergang der Neigung
            this.angle += (this.targetAngle - this.angle) * 0.1;
            
            // Höhe anpassen basierend auf Neigung
            this.y += Math.sin(this.angle) * this.speed;

            // Speed Control
            if(keys['KeyD']) this.speed = 9;
            else if(keys['KeyA']) this.speed = 4;
            else this.speed = 6;

            if(this.y < 50) this.y = 50;
            if(this.y > canvas.height - 150) this.y = canvas.height - 150;

            if(keys['Space'] && frame % 5 === 0) fireCannon();
            if(keys['KeyB'] && hasBombs && bombCooldown <= 0) dropBomb();
        },
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);

            // Flugzeug-Schatten
            ctx.shadowBlur = 15;
            ctx.shadowColor = "rgba(0,0,0,0.5)";

            // Rumpf (Tornado Shape)
            ctx.fillStyle = '#4a4e51';
            ctx.beginPath();
            ctx.moveTo(-50, 0);
            ctx.lineTo(60, 0);  // Nase
            ctx.lineTo(50, 10);
            ctx.lineTo(-40, 15);
            ctx.closePath();
            ctx.fill();

            // Cockpit
            ctx.fillStyle = '#00d2ff';
            ctx.beginPath();
            ctx.ellipse(30, 2, 15, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Leitwerk
            ctx.fillStyle = '#3a3e41';
            ctx.beginPath();
            ctx.moveTo(-45, 0);
            ctx.lineTo(-60, -25);
            ctx.lineTo(-35, 0);
            ctx.fill();

            ctx.restore();
        }
    };

    let bullets = [];
    let bombs = [];
    let targets = [];
    let particles = [];
    let frame = 0;

    function fireCannon() {
        bullets.push({
            x: jet.x + 50, 
            y: jet.y + 10, 
            vx: Math.cos(jet.angle) * 20, 
            vy: Math.sin(jet.angle) * 20,
            life: 60
        });
    }

    function dropBomb() {
        bombs.push({ x: jet.x, y: jet.y + 20, vx: jet.speed, vy: 2 });
        bombCooldown = BOMB_MAX_COOLDOWN;
    }

    function spawnTarget() {
        if(frame % 100 === 0) {
            targets.push({
                x: canvas.width + 100,
                y: canvas.height - 40,
                type: Math.random() > 0.3 ? 'tank' : 'radar',
                hp: 1
            });
        }
    }

    function createExplosion(x, y, color = '#ff4400') {
        for(let i=0; i<20; i++) {
            particles.push({
                x, y, 
                vx: (Math.random()-0.5)*12, 
                vy: (Math.random()-0.5)*12, 
                life: 1.0, color
            });
        }
    }

    function toggleShop() {
        isShopOpen = !isShopOpen;
        document.getElementById('shop-ui').style.display = isShopOpen ? 'block' : 'none';
    }

    function buy(item) {
        if(item === 'bombs' && score >= 500) {
            score -= 500;
            hasBombs = true;
            toggleShop();
        }
    }

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        frame++;

        if(bombCooldown > 0) bombCooldown--;
        document.getElementById('bomb-bar').style.width = (1 - bombCooldown / BOMB_MAX_COOLDOWN) * 100 + "%";

        // Background (Parallax Berge)
        ctx.fillStyle = '#1a1a2e';
        ctx.beginPath();
        for(let i=0; i<=canvas.width; i+=100) {
            let h = Math.sin((i + frame * 2) * 0.002) * 50 + 100;
            ctx.lineTo(i, canvas.height - h);
        }
        ctx.lineTo(canvas.width, canvas.height);
        ctx.lineTo(0, canvas.height);
        ctx.fill();

        if(!isShopOpen) {
            jet.update();
            spawnTarget();
        }

        // Draw Ground
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, canvas.height - 40, canvas.width, 40);

        // Update & Draw Bullets
        bullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy; b.life--;
            ctx.fillStyle = 'yellow';
            ctx.fillRect(b.x, b.y, 8, 2);
            if(b.life <= 0) bullets.splice(i, 1);
        });

        // Update & Draw Bombs
        bombs.forEach((b, i) => {
            b.x += b.vx; b.vy += 0.15; b.y += b.vy;
            ctx.fillStyle = '#777';
            ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, 7); ctx.fill();
            if(b.y > canvas.height - 40) {
                createExplosion(b.x, b.y, '#ffaa00');
                targets.forEach((t, ti) => {
                    if(Math.abs(t.x - b.x) < 80) {
                        createExplosion(t.x, t.y);
                        targets.splice(ti, 1);
                        score += 100;
                    }
                });
                bombs.splice(i, 1);
            }
        });

        // Targets
        targets.forEach((t, i) => {
            t.x -= 4;
            ctx.fillStyle = t.type === 'tank' ? '#2f3542' : '#57606f';
            ctx.fillRect(t.x, t.y - 20, 50, 20); // Base
            if(t.type === 'radar') {
                ctx.beginPath(); ctx.arc(t.x+25, t.y-30, 15, 0, Math.PI, true); ctx.stroke();
            }

            // Collision with bullets
            bullets.forEach((b, bi) => {
                if(b.x > t.x && b.x < t.x + 50 && b.y > t.y - 20) {
                    createExplosion(t.x + 25, t.y - 10);
                    targets.splice(i, 1);
                    bullets.splice(bi, 1);
                    score += 50;
                }
            });
            if(t.x < -100) targets.splice(i, 1);
        });

        // Particles
        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.life -= 0.02;
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, 4, 4);
            if(p.life <= 0) particles.splice(i, 1);
        });
        ctx.globalAlpha = 1;

        jet.draw();
        document.getElementById('score').innerText = score;
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
